<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Yoann Giordano</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound {
      min-height: 100vh; display: grid; place-items: center;
      text-align: center; padding: 2rem;
    }
    .notfound h1 {
      font-size: clamp(4rem, 15vw, 8rem); font-weight: 900; line-height: 1;
    }
    .notfound p { color: var(--muted); margin: 1rem 0 2rem; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <h1 class="gradient-text">404</h1>
      <p>Oups… cette page n'existe pas (ou plus).</p>
      <a class="btn btn-primary" href="./">← Retour à l'accueil</a>
    </div>
  </main>
</body>
</html>
